<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RZXXY AI Marketing</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            background: #101827;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 760px;
            margin: 40px auto;
            background: #1e293b;
            padding: 24px;
            border-radius: 14px;
        }

        h1 { margin-top: 0; color: #60a5fa; }

        #messages {
            min-height: 280px;
            max-height: 480px;
            overflow-y: auto;
            padding: 14px;
            background: #0f172a;
            border-radius: 10px;
            margin-bottom: 16px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message {
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            line-height: 1.5;
        }

        .user { background: #1d4ed8; }
        .assistant { background: #334155; }
        .error { background: #7f1d1d; }

        textarea {
            width: 100%;
            min-height: 90px;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 8px;
            background: #0f172a;
            color: white;
            font-size: 16px;
            resize: vertical;
        }

        button {
            margin-top: 12px;
            padding: 12px 22px;
            border: 0;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status { color: #94a3b8; }
    </style>
</head>
<body>
    <main class="container">
        <h1>RZXXY AI Marketing</h1>
        <p>AI-powered marketing assistant</p>

        <div id="messages" aria-live="polite">
            <div class="message assistant">
                Hello! How can I help with your marketing task?
            </div>
        </div>

        <form id="chat-form">
            <textarea
                id="message"
                placeholder="Write your marketing task..."
                required
            ></textarea>
            <button id="send-button" type="submit">Send</button>
            <p id="status"></p>
        </form>
    </main>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const messages = document.getElementById("messages");
        const button = document.getElementById("send-button");
        const status = document.getElementById("status");

        function addMessage(text, type) {
            const item = document.createElement("div");
            item.className = "message " + type;
            item.textContent = text;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        }

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            addMessage("You: " + message, "user");
            input.value = "";
            button.disabled = true;
            status.textContent = "AI is working...";

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Request failed.");
                }

                addMessag(

                    "Categories: " + data.categories.join(", ") +

                    "\n\n" + data.answer,

                    "assistant"

                );

            } catch (error) {

                addMessage("Error: " + error.message, "error");

            } finally {

                button.disabled = false;

                status.textContent = "";

                input.focus();

            }

        });

    </script>

</body>

</html>
